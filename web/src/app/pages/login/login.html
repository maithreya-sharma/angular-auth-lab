<div style="display:flex; justify-content:center; align-items:center; min-height:100dvh; padding:16px; box-sizing:border-box;">
  <form [formGroup]="form" (ngSubmit)="onSubmit()"
        style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px; padding:32px; border:1px solid #e2e2e2; border-radius:12px;">
    <h1 style="margin:0 0 8px; text-align:center;">Sign in</h1>

    <label style="display:flex; flex-direction:column; gap:4px;">
      Email <input type="email" formControlName="email" autocomplete="username" style="padding:10px;" />
    </label>
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small style="color:#c62828;">Enter a valid email</small>
    }

    <label style="display:flex; flex-direction:column; gap:4px;">
      Password <input type="password" formControlName="password" autocomplete="current-password" style="padding:10px;" />
    </label>
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small style="color:#c62828;">Password is required</small>
    }

    @if (error()) { <p role="alert" style="color:#c62828; margin:0;">{{ error() }}</p> }

    <button type="submit" [disabled]="loading()" style="padding:10px; cursor:pointer;">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
